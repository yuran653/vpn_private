# Web server inside the site container. Reached only from the host's nginx,
# through 127.0.0.1:8080. Keeps no access log (R-vpn-server-06.b).
server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    access_log off;
    root /usr/share/nginx/html;
    index index.html;
    location / { try_files $uri $uri/ =404; }
}
