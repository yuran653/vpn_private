# Web server inside the site container. Reached only from the host's nginx,
# through 127.0.0.1:8080. This is the container's whole nginx configuration,
# so the image's own access log line is not in effect: no access log is kept
# (R-vpn-server-06.b).
worker_processes 1;
error_log stderr crit;
pid /run/nginx.pid;
events { worker_connections 256; }
http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    access_log off;
    server_tokens off;
    sendfile on;
    server {
        listen 80 default_server;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;
        location / { try_files $uri $uri/ =404; }
    }
}
